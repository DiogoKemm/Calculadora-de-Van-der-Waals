<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Van der Waals — calculadora</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 780px; margin: 2rem auto; padding: 0 1rem; }
  fieldset { border: 1px solid #ccc; border-radius: 6px; padding: .8rem 1rem; margin: 1rem 0; }
  legend { font-weight: bold; padding: 0 .4rem; }
  label { display: block; margin: .4rem 0; }
  input[type=number], input[type=text], select { width: 12rem; padding: .25rem .4rem; }
  input[disabled] { background: #f0f0f0; color: #888; }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
  .muted { color: #666; font-size: .9em; }
  button { padding: .4rem .9rem; cursor: pointer; }
  table { border-collapse: collapse; margin-top: 1rem; }
  td, th { border: 1px solid #ccc; padding: .25rem .6rem; text-align: right; }
  .hidden { display: none; }
  .gas-list li { margin: .2rem 0; }
</style>
</head>
<body>

<h1>Volume de van der Waals</h1>

<fieldset>
  <legend>Condições</legend>
  <label>Pressão (atm): <input type="number" id="pressao" value="2" step="any"></label>
  <label>Temperatura (°C): <input type="number" id="temp_celsius" value="100" step="any"></label>
</fieldset>

<fieldset>
  <legend>Gás</legend>
  <label>Substância: <select id="gas"></select></label>

  <!-- Gás de tabela -->
  <div id="sec-tabela">
    <label>Massa (g): <input type="number" id="grama" value="100" step="any"></label>
    <p class="muted" id="gas-info"></p>
  </div>

  <!-- Gás personalizado -->
  <div id="sec-custom" class="hidden">
    <div class="row">
      <label>a (L²·atm/mol²): <input type="number" id="a_custom" value="1.37" step="any"></label>
      <label>b (L/mol):       <input type="number" id="b_custom" value="0.0387" step="any"></label>
    </div>
    <div class="row">
      <label>Massa (g):           <input type="number" id="grama_custom" value="100" step="any"></label>
      <label>Massa molar (g/mol): <input type="number" id="mm_custom" value="28.014" step="any"></label>
    </div>
    <div class="row">
      <label><input type="checkbox" id="mols_manual"> Editar mols manualmente</label>
      <label>Mols: <input type="number" id="mols_custom" value="3.570572" step="any" disabled></label>
    </div>

    <div class="row" style="margin-top:.8rem; padding-top:.6rem; border-top:1px dashed #ccc;">
      <label>Nome: <input type="text" id="nome_novo" placeholder="ex: O2"></label>
      <button type="button" id="btn-salvar">＋ Salvar na lista</button>
    </div>
    <p class="muted">Preencha a, b, massa molar e um nome para salvar. Ele aparece
       no dropdown e é persistido no navegador.</p>
  </div>
</fieldset>

<button type="button" id="btn-calcular" style="padding:.6rem 1.4rem; font-size:1em;">Calcular</button>

<div id="resultado"></div>

<fieldset id="sec-usuarios" class="hidden">
  <legend>Gases salvos por você</legend>
  <ul id="lista-usuarios" class="gas-list"></ul>
  <button type="button" id="btn-limpar">Limpar todos os salvos</button>
</fieldset>

<!-- ===================== Python embutido ===================== -->
<script id="py-src" type="text/python">
import json

CONSTANTES = {
    "N2":    [1.37,  0.0387, 28.014],
    "C4H10": [14.66, 0.1226, 58.124],
}
PADRAO = set(CONSTANTES.keys())

def calcular_volume(pressao, temp_celsius, a, b, mols, precisao=1e-6):
    temp_kelvin = temp_celsius + 273.15
    R = 0.082057

    def f(V):
        return (pressao + a * mols**2 / V**2) * (V - mols * b) - mols * R * temp_kelvin

    def dV(V, h=1e-5):
        return (f(V + h) - f(V - h)) / (2 * h)

    gas_ideal = mols * R * temp_kelvin / pressao

    if f(gas_ideal) < 0:
        lo, hi = gas_ideal, gas_ideal + 1
        while f(hi) < 0: hi += 1
    else:
        lo, hi = gas_ideal - 1, gas_ideal
        while f(lo) > 0: lo -= 1

    h2  = 1e-3
    d2f = (dV(lo + h2) - dV(lo - h2)) / (2 * h2)
    V0  = lo if dV(lo) * d2f < 0 else hi

    iters = [{"i": 0, "V": V0, "fV": f(V0)}]
    i, fV = 0, f(V0)
    while abs(fV) > precisao and i < 30:
        i += 1
        V0 -= fV / dV(V0)
        fV  = f(V0)
        iters.append({"i": i, "V": V0, "fV": fV})

    return json.dumps({
        "volume":       V0,
        "volume_ideal": gas_ideal,
        "convergiu":    abs(fV) <= precisao,
        "iteracoes":    iters,
    })

def listar_gases():
    return json.dumps({k: list(v) for k, v in CONSTANTES.items()})

def adicionar_gas(nome, a, b, massa_molar):
    CONSTANTES[nome] = [float(a), float(b), float(massa_molar)]
    return listar_gases()

def remover_gas(nome):
    if nome not in PADRAO:
        CONSTANTES.pop(nome, None)
    return listar_gases()
</script>

<script src="https://cdn.jsdelivr.net/pyodide/v0.27.0/full/pyodide.js"></script>
<script>
const BUILTIN = new Set(["N2", "C4H10"]);
const LS_KEY  = "vdw_gases";

let calcularVolume, listarGases, adicionarGas, removerGas;

async function init() {
  const py = await loadPyodide();
  await py.runPythonAsync(document.getElementById("py-src").textContent);

  calcularVolume = py.globals.get("calcular_volume");
  listarGases    = py.globals.get("listar_gases");
  adicionarGas   = py.globals.get("adicionar_gas");
  removerGas     = py.globals.get("remover_gas");

  // Recarrega gases salvos no navegador
  const salvos = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
  for (const [nome, [a, b, mm]] of Object.entries(salvos)) {
    adicionarGas(nome, a, b, mm);
  }

  atualizarDropdown();
  atualizarSecao();
  atualizarMols();
  atualizarListaUsuarios();

  document.getElementById("gas").addEventListener("change", atualizarSecao);
  document.getElementById("mols_manual").addEventListener("change", atualizarMols);
  document.getElementById("grama_custom").addEventListener("input", atualizarMols);
  document.getElementById("mm_custom").addEventListener("input", atualizarMols);
  document.getElementById("btn-calcular").addEventListener("click", calcular);
  document.getElementById("btn-salvar").addEventListener("click", salvarGas);
  document.getElementById("btn-limpar").addEventListener("click", limparSalvos);
}

function gasesAtuais() {
  return JSON.parse(listarGases());
}

function atualizarDropdown() {
  const sel = document.getElementById("gas");
  const atual = sel.value;
  const gases = gasesAtuais();
  sel.innerHTML = "";
  for (const nome of Object.keys(gases)) {
    const opt = document.createElement("option");
    opt.value = nome;
    opt.textContent = nome;
    sel.appendChild(opt);
  }
  const custom = document.createElement("option");
  custom.value = "__custom__";
  custom.textContent = "Personalizado...";
  sel.appendChild(custom);
  if (atual && [...sel.options].some(o => o.value === atual)) sel.value = atual;
}

function atualizarSecao() {
  const gas    = document.getElementById("gas").value;
  const custom = gas === "__custom__";
  document.getElementById("sec-tabela").classList.toggle("hidden", custom);
  document.getElementById("sec-custom").classList.toggle("hidden", !custom);

  if (!custom) {
    const gases = gasesAtuais();
    const info  = gases[gas];
    document.getElementById("gas-info").textContent = info
      ? `a = ${info[0]} · b = ${info[1]} · M = ${info[2]} g/mol`
      : "";
  }
}

function atualizarMols() {
  const manual = document.getElementById("mols_manual").checked;
  const input  = document.getElementById("mols_custom");
  input.disabled = !manual;
  if (manual) return;

  const grama = parseFloat(document.getElementById("grama_custom").value);
  const mm    = parseFloat(document.getElementById("mm_custom").value);
  input.value = (Number.isFinite(grama) && Number.isFinite(mm) && mm > 0)
    ? (grama / mm).toFixed(6)
    : "";
}

function calcular() {
  const pressao = parseFloat(document.getElementById("pressao").value);
  const temp    = parseFloat(document.getElementById("temp_celsius").value);
  const gas     = document.getElementById("gas").value;

  let a, b, mols;

  if (gas === "__custom__") {
    a    = parseFloat(document.getElementById("a_custom").value);
    b    = parseFloat(document.getElementById("b_custom").value);
    mols = parseFloat(document.getElementById("mols_custom").value);
  } else {
    const gases = gasesAtuais();
    const info  = gases[gas];
    if (!info) return mostrarErro("Selecione um gás válido.");
    [a, b] = info;
    const mm    = info[2];
    const grama = parseFloat(document.getElementById("grama").value);
    mols = grama / mm;
  }

  if (![a, b, mols, pressao, temp].every(Number.isFinite))
    return mostrarErro("Preencha todos os campos com números válidos.");
  if (mols <= 0)         return mostrarErro("A quantidade de mols deve ser positiva.");
  if (pressao <= 0)      return mostrarErro("A pressão deve ser positiva.");
  if (temp <= -273.15)   return mostrarErro("Temperatura abaixo do zero absoluto.");

  const r = JSON.parse(calcularVolume(pressao, temp, a, b, mols));
  render(r, mols, temp);
}

function render(d, mols, temp) {
  const linhas = d.iteracoes.map(it =>
    `<tr><td>${it.i}</td><td>${it.V.toFixed(6)}</td><td>${it.fV.toExponential(3)}</td></tr>`
  ).join("");

  document.getElementById("resultado").innerHTML = `
    <p><strong>V = ${d.volume.toFixed(6)} L</strong>
       ${d.convergiu ? "✔" : "✖ (não convergiu em 30 iterações)"}</p>
    <p class="muted">
      n = ${mols.toFixed(4)} mol · T = ${(temp + 273.15).toFixed(2)} K ·
      V<sub>ideal</sub> = ${d.volume_ideal.toFixed(6)} L
    </p>
    <table>
      <thead><tr><th>i</th><th>V (L)</th><th>f(V)</th></tr></thead>
      <tbody>${linhas}</tbody>
    </table>`;
}

function mostrarErro(msg) {
  document.getElementById("resultado").innerHTML = `<p style="color:#c00">${msg}</p>`;
}

function salvarGas() {
  const nome = document.getElementById("nome_novo").value.trim();
  const a    = parseFloat(document.getElementById("a_custom").value);
  const b    = parseFloat(document.getElementById("b_custom").value);
  const mm   = parseFloat(document.getElementById("mm_custom").value);

  if (!nome)             return alert("Informe um nome para o gás.");
  if (BUILTIN.has(nome)) return alert(`'${nome}' é um gás padrão. Escolha outro nome.`);
  if (![a, b, mm].every(Number.isFinite) || mm <= 0)
    return alert("Preencha a, b e massa molar (positiva) para salvar.");

  const salvos = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
  salvos[nome] = [a, b, mm];
  localStorage.setItem(LS_KEY, JSON.stringify(salvos));
  adicionarGas(nome, a, b, mm);

  atualizarDropdown();
  document.getElementById("gas").value = nome;
  atualizarSecao();
  atualizarListaUsuarios();
  document.getElementById("nome_novo").value = "";
}

function atualizarListaUsuarios() {
  const salvos = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
  const nomes  = Object.keys(salvos);
  document.getElementById("sec-usuarios").classList.toggle("hidden", nomes.length === 0);

  const ul = document.getElementById("lista-usuarios");
  ul.innerHTML = "";
  for (const nome of nomes) {
    const [a, b, mm] = salvos[nome];
    const li = document.createElement("li");
    li.innerHTML = `<strong>${nome}</strong>
      <span class="muted">(a=${a}, b=${b}, M=${mm})</span>
      <button type="button" data-nome="${nome}" class="btn-rm">remover</button>`;
    ul.appendChild(li);
  }

  ul.querySelectorAll(".btn-rm").forEach(btn => {
    btn.addEventListener("click", () => {
      const nome = btn.dataset.nome;
      removerGas(nome);
      const salvos = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
      delete salvos[nome];
      localStorage.setItem(LS_KEY, JSON.stringify(salvos));
      atualizarDropdown();
      atualizarSecao();
      atualizarListaUsuarios();
    });
  });
}

function limparSalvos() {
  if (!confirm("Remover todos os gases salvos?")) return;
  const salvos = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
  for (const nome of Object.keys(salvos)) removerGas(nome);
  localStorage.removeItem(LS_KEY);
  atualizarDropdown();
  atualizarSecao();
  atualizarListaUsuarios();
}

init();
</script>
</body>
</html>
